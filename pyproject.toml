[build-system]
requires = ['setuptools>=61']
build-backend = 'setuptools.build_meta'
[project]
name = 'treelab'
version = '0.2.0'
description = 'From-scratch CART regression and inspectable weakest-link pruning on group-disjoint real data'
readme = 'README.md'
requires-python = '>=3.10'
dependencies = ['numpy==2.2.6']
license = {text = 'MIT code; UCI data CC BY 4.0'}
[tool.setuptools.packages.find]
include = ['treelab*']
[tool.setuptools.package-data]
treelab = ['data/*', 'artifacts/*.json', 'artifacts/*.json.gz']
