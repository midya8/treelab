name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: bash examples/demo.sh
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python -m pip wheel . --no-deps -w /tmp/wheels
      - run: python -m pip install --target /tmp/installed /tmp/wheels/*.whl
      - run: |
          (cd /tmp && PYTHONPATH=/tmp/installed python -m treelab demo) > /tmp/wheel-demo.json
          cmp /tmp/wheel-demo.json treelab/artifacts/report.json
          (cd /tmp && PYTHONPATH=/tmp/installed python -m treelab predict --model /tmp/installed/treelab/artifacts/selected-model.json --input "$GITHUB_WORKSPACE/examples/input.json") > /tmp/wheel-predict.json
          PYTHONPATH=/tmp/installed python -m treelab predict --model treelab/artifacts/selected-model.json --input examples/input.json > /tmp/source-predict.json
          cmp /tmp/wheel-predict.json /tmp/source-predict.json
          (cd /tmp && PYTHONPATH=/tmp/installed python -m treelab audit --output /tmp/wheel-refit) > /tmp/wheel-report.json
          (cd /tmp && PYTHONPATH=/tmp/installed python -m treelab fit --input "$GITHUB_WORKSPACE/examples/train.json" --output /tmp/wheel-fit.json --min-leaf 1) > /tmp/wheel-fit-summary.json
          (cd /tmp && PYTHONPATH=/tmp/installed python -m treelab prune --model /tmp/wheel-fit.json --alpha 1 --output /tmp/wheel-pruned.json) > /tmp/wheel-prune-summary.json
          (cd /tmp && PYTHONPATH=/tmp/installed python -m treelab bag-demo) > /tmp/wheel-bag-demo.json
          cmp /tmp/wheel-bag-demo.json treelab/artifacts/bagging-report.json
          (cd /tmp && PYTHONPATH=/tmp/installed python -m treelab bag-predict --model /tmp/installed/treelab/artifacts/bagging-model.json.gz --input "$GITHUB_WORKSPACE/examples/input.json") > /tmp/wheel-frozen-bag-predict.json
          (cd /tmp && PYTHONPATH=/tmp/installed python -m treelab bag-audit --output /tmp/wheel-bag-refit) > /tmp/wheel-bag-report.json
          (cd /tmp && PYTHONPATH=/tmp/installed python -m treelab bag-fit --input "$GITHUB_WORKSPACE/examples/train.json" --output /tmp/wheel-ensemble.json --trees 4 --min-leaf 1) > /tmp/wheel-bag-summary.json
          python -c "import json; d=json.load(open('examples/train.json'));json.dump({'features':d['features']},open('/tmp/bag-input.json','w'))"
          (cd /tmp && PYTHONPATH=/tmp/installed python -m treelab bag-predict --model /tmp/wheel-ensemble.json --input /tmp/bag-input.json) > /tmp/wheel-bag-predict.json
          (cd /tmp && PYTHONPATH=/tmp/installed python -m treelab bag-oob --model /tmp/wheel-ensemble.json --input "$GITHUB_WORKSPACE/examples/train.json") > /tmp/wheel-bag-oob.json
          (cd /tmp && PYTHONPATH=/tmp/installed python -m treelab sweep-demo) > /tmp/wheel-sweep-demo.json
          cmp /tmp/wheel-sweep-demo.json treelab/artifacts/sweep-report.json
          (cd /tmp && PYTHONPATH=/tmp/installed python -m treelab sweep-audit --output /tmp/wheel-sweep-refit) > /tmp/wheel-sweep-report.json
          cmp /tmp/wheel-sweep-report.json treelab/artifacts/sweep-report.json
          (cd /tmp && PYTHONPATH=/tmp/installed python -m treelab sweep --model /tmp/installed/treelab/artifacts/bagging-model.json.gz --input "$GITHUB_WORKSPACE/examples/sweep.json") > /tmp/wheel-sweep.json
          (cd /tmp && PYTHONPATH=/tmp/installed python - "$GITHUB_WORKSPACE" <<'PY'  
          import json,sys,unittest
          from pathlib import Path
          import treelab,treelab.__main__,treelab.tree,treelab.data,treelab.experiment,treelab.bagging,treelab.sweep
          assert Path(treelab.__file__).is_relative_to('/tmp/installed')
          sys.path.insert(0,str(Path(sys.argv[1])/'tests'))
          from test_experiment import equal
          from test_bagging import load
          for name in ['report','grown-model','selected-model']:
              equal(unittest.TestCase(),json.load(open(Path(sys.argv[1])/'treelab/artifacts'/(name+'.json'))),json.load(open(Path('/tmp/wheel-refit')/(name+'.json'))))
          for name in ['bagging-model.json.gz','bagging-report.json']:
              equal(unittest.TestCase(),load(Path(sys.argv[1])/'treelab/artifacts'/name),load(Path('/tmp/wheel-bag-refit')/name))
          assert len(json.load(open('/tmp/wheel-sweep.json'))['segments'])==50
          assert len(json.load(open('/tmp/wheel-bag-predict.json'))['predictions'])==4
          assert json.load(open('/tmp/wheel-bag-oob.json'))['prefixes'][0]['trees']==4
          assert json.load(open('/tmp/wheel-prune-summary.json'))['leaves']==1
          print('Seven modules, thirteen CLI modes, bundled source hashes and installed-wheel refit verified')
          PY
          )
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - run: python -m pip install -e .
      - run: python examples/export_explorer.py
      - run: git diff --exit-code docs/data.js
      - env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node --test tests/test_explorer.cjs tests/test_explorer_browser.cjs
